name: MarkSave YT embed canary

# Watches the YouTube EMBED PLAYER (the Error-153 path) by loading the hidden
# wrapper page on wystoneapps.com in headless Chromium every 2 hours.
# Companion to the API canary in the markSave repo. Alerts go to the ntfy topic
# (push on your iPhone); a failed run additionally triggers GitHub's own
# "Run failed: MarkSave YT embed canary" email as backup.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo activity —
# any push re-arms it.

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (offset to dodge top-of-hour load)
  workflow_dispatch: {}       # run on demand from the Actions tab

jobs:
  embed-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run embed canary
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'Marksave_YT_alerts' }}
        run: python scripts/embed_canary.py
